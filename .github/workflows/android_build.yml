name: Android Build (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME:     /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653

    steps:
      - uses: actions/checkout@v4

      # إضافة مساحة ذاكرة افتراضية
      - name: Create Swap Space
        run: |
          sudo swapoff -a
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # نستخدم 3.11 لضمان استقرار المكتبات
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses-dev cmake libffi-dev libssl-dev ccache
          wget -q http://launchpadlibrarian.net/648013231/libtinfo5_6.4-2_amd64.deb -O libtinfo5.deb
          sudo dpkg -i libtinfo5.deb || sudo apt-get -f install -y

      - name: Install Buildozer + Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython virtualenv gdown

      - name: Download YOLOv8n ONNX Model
        run: |
          gdown --fuzzy "https://drive.google.com/uc?export=download&id=1EC4jcyO55ES37czrw3_W7XZMHS3qsReV" -O yolov8n.onnx || true

      - name: Install Android SDK
        run: |
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          curl -fsSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d cmdline
          sudo rm -rf $ANDROID_SDK_ROOT/cmdline-tools/latest
          sudo mv cmdline/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          sudo chown -R $USER:$USER $ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT/licenses
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" >/dev/null

      # خطوة مهمة: مسح الكاش القديم لتجنب تعارض نسخ بايثون
      - name: Clear Old Cache
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build debug APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDNDK: ${{ env.ANDROID_NDK_HOME }}
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "24"
        run: |
          yes | buildozer -v android debug

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visualassist-debug-apk
          path: bin/*.apk
          if-no-files-found: warn
