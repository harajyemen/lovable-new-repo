name: Android Build (Buildozer)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME:     /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.2.9519653
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.2.9519653

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Buildozer + Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.36 virtualenv

      - name: Download Model from Drive
        run: |
          wget --no-check-certificate -O yolov8n.onnx "https://drive.google.com/uc?export=download&id=1EC4jcyO55ES37czrw3_W7XZMHS3qsReV"

      - name: Install Android SDK & Accept Licenses
        run: |
          set -e
          sudo mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd /tmp
          curl -fsSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip -d cmdline
          sudo mv cmdline/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          # إنشاء مجلد الرخص والموافقة التلقائية
          sudo mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | sudo tee $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f51874737515e191354c5e3b747370b682a50" | sudo tee $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          
          # تثبيت الأدوات
          sudo $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
              "platform-tools" \
              "platforms;android-33" \
              "build-tools;33.0.2" \
              "ndk;25.2.9519653" >/dev/null
          echo "PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_ENV

      - name: Cache Buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDNDK: ${{ env.ANDROID_NDK_HOME }}
          ANDROIDAPI: "33"
          ANDROIDMINAPI: "24"
        run: |
          # التأكد من إعداد المسارات قبل التشغيل
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: visualassist-debug-apk
          path: bin/*.apk
          if-no-files-found: error
